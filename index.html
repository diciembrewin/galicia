<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Banking</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#ececec;
}

.phone{
    width:390px;
    margin:20px auto;
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

/* Header */

.header{
    background:#f97300;
    color:#fff;
    padding:20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#fff;
    color:#f97300;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
}

.icons{
    display:flex;
    gap:18px;
    font-size:22px;
}

.btn{
    margin:25px auto;
    width:180px;
    background:#fff;
    color:#5b3715;
    padding:12px;
    border-radius:30px;
    text-align:center;
    font-weight:bold;
}

.account{
    text-align:center;
}

.account h3{
    font-size:20px;
    margin-bottom:15px;
}

.balance{
    font-size:65px;
    font-weight:bold;
}

.number{
    margin-top:20px;
    font-size:20px;
}

/* Acciones */

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:40px;
}

.action{
    text-align:center;
}

.circle{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#8b4513;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

.action p{
    margin-top:10px;
    font-size:15px;
}

/* Indicadores */

.slider{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:30px 0 5px;
}

.slider span{
    width:10px;
    height:10px;
    background:#ffd5b2;
    border-radius:20px;
}

.slider span:first-child{
    width:35px;
    background:#fff;
}

/* Contenido */

.content{
    padding:20px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    min-height:140px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.big{
    background:#ff6f00;
    color:#fff;
}

.card i{
    font-size:35px;
    color:#ff6f00;
    margin-bottom:15px;
}

.big i{
    color:#fff;
}

.card h3{
    font-size:18px;
}

.card p{
    margin-top:10px;
    color:#555;
}

/* Footer */

.footer{
    position:sticky;
    bottom:0;
    background:#fff;
    display:flex;
    justify-content:space-around;
    padding:12px 0;
    border-top:1px solid #ddd;
}

.item{
    text-align:center;
    color:#666;
    font-size:14px;
}

.item i{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

.active{
    color:#ff6f00;
}

@media(max-width:420px){

.phone{
    width:100%;
    margin:0;
    border-radius:0;
}

}
</style>

</head>
<body>

<div class="phone">

<div class="header">

<div class="top">

<div class="logo">
<i class="fa-solid fa-cross"></i>
</div>

<div class="icons">
<i class="fa-regular fa-eye"></i>
<i class="fa-regular fa-circle-question"></i>
<i class="fa-regular fa-bell"></i>
</div>

</div>

<div class="btn">
Ir a Cuentas
</div>

<div class="account">

<h3>Caja de ahorro en pesos</h3>

<div class="balance">
$ 0<sup style="font-size:25px;">00</sup>
</div>

<div class="number">
★ Nº 4070450-4 028-4
</div>

</div>

<div class="actions">

<div class="action">
<div class="circle">
<i class="fa-solid fa-arrow-up-right-from-square"></i>
</div>
<p>Transferir</p>
</div>

<div class="action">
<div class="circle">
<i class="fa-solid fa-arrow-down-left"></i>
</div>
<p>Ingresar</p>
</div>

<div class="action">
<div class="circle">
<i class="fa-regular fa-copy"></i>
</div>
<p>Copiar CBU</p>
</div>

<div class="action">
<div class="circle">
<i class="fa-solid fa-dollar-sign"></i>
</div>
<p>Comprar</p>
</div>

</div>

<div class="slider">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</div>

<div class="content">

<div class="title">
<h1>Accesos directos</h1>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div class="cards">

<div class="card big">
<i class="fa-solid fa-file-invoice-dollar"></i>
<h3>Pagá o agregá tus servicios</h3>
</div>

<div class="card">
<i class="fa-solid fa-building-columns"></i>
<h3>Agregar / Retirar</h3>
</div>

<div class="card">
<i class="fa-solid fa-money-bill-transfer"></i>
<h3>Comprar / Vender</h3>
</div>

<div class="card">
<i class="fa-solid fa-shield-halved"></i>
<h3>Generar Token</h3>
</div>

</div>

</div>

<div class="footer">

<div class="item active">
<i class="fa-solid fa-house"></i>
Inicio
</div>

<div class="item">
<i class="fa-regular fa-credit-card"></i>
Tarjetas
</div>

<div class="item">
<i class="fa-solid fa-arrow-right-arrow-left"></i>
Transferencias
</div>

<div class="item">
<i class="fa-solid fa-bars"></i>
Más
</div>

</div>

</div>

</body>
</html>
