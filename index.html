<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eceff5;
display:flex;
justify-content:center;
padding:20px;
}

.phone{

width:390px;
background:white;
border-radius:35px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.25);

}

.header{

background:linear-gradient(180deg,#1d3df1,#1440d8);
padding:25px;
color:white;

}

.badge{

display:inline-block;
background:white;
color:#2040db;
padding:8px 20px;
border-radius:20px;
font-weight:bold;
margin-bottom:20px;

}

.subtitle{

font-size:18px;
opacity:.9;

}

.balance{

font-size:55px;
font-weight:bold;
margin-top:10px;

}

.account{

opacity:.8;
margin-top:8px;

}

.actions{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:30px;

}

.action{

text-align:center;

}

.circle{

width:60px;
height:60px;
background:#1633aa;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
font-size:22px;

}

.action span{

display:block;
margin-top:8px;
font-size:13px;

}

.banner{

margin-top:25px;
background:#0f2b92;
padding:15px;
border-radius:25px;
display:flex;
justify-content:space-between;
align-items:center;

}

.content{

padding:20px;

}

.section-title{

font-size:24px;
font-weight:bold;
margin-bottom:15px;

}

.card{

background:#f7f8fc;
padding:18px;
border-radius:18px;
margin-bottom:18px;

}

.money{

font-size:20px;
margin-top:10px;
color:#444;

}

.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}

.quick{

background:#f6f6fb;
padding:20px;
border-radius:18px;
min-height:120px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

}

.quick i{

font-size:35px;
color:#2040db;
margin-bottom:12px;

}

.bottom{

position:relative;
display:grid;
grid-template-columns:repeat(5,1fr);
padding:18px 0;
background:white;
border-top:1px solid #ddd;

}

.nav{

text-align:center;
font-size:13px;
color:#555;

}

.nav i{

font-size:22px;
display:block;
margin-bottom:8px;

}

.center{

margin-top:-35px;

}

.center .fab{

width:70px;
height:70px;
background:#163cff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:30px;
margin:auto;
border:5px solid white;

}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<div class="badge">
Ir a cuentas
</div>

<div class="subtitle">
Caja de ahorro en dólares
</div>

<div class="balance">
USD 0.48
</div>

<div class="account">
N° 4005843-2045-9
</div>

<div class="actions">

<div class="action">
<div class="circle">
<i class="fa-solid fa-arrow-up"></i>
</div>
<span>Transferir</span>
</div>

<div class="action">
<div class="circle">
<i class="fa-solid fa-chart-line"></i>
</div>
<span>Operar</span>
</div>

<div class="action">
<div class="circle">
<i class="fa-regular fa-copy"></i>
</div>
<span>Copiar CBU</span>
</div>

<div class="action">
<div class="circle">
<i class="fa-solid fa-dollar-sign"></i>
</div>
<span>Comprar</span>
</div>

</div>

<div class="banner">
<span>Activar cuenta remunerada</span>
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>

<div class="content">

<div class="section-title">
Vencimientos
</div>

<div class="card">

<strong>Próximos 7 días</strong>

<div class="money">
$ 9.516.047 + USD 130
</div>

</div>

<div class="section-title">
Accesos rápidos
</div>

<div class="grid">

<div class="quick">

<i class="fa-solid fa-sack-dollar"></i>

<h3>Sueldo</h3>

</div>

<div class="quick">

<i class="fa-solid fa-shield-halved"></i>

<h3>Token</h3>

</div>

<div class="quick">

<i class="fa-solid fa-credit-card"></i>

<h3>Tarjetas</h3>

</div>

<div class="quick">

<i class="fa-solid fa-money-check-dollar"></i>

<h3>Pagos</h3>

</div>

</div>

</div>

<div class="bottom">

<div class="nav">
<i class="fa-solid fa-house"></i>
Inicio
</div>

<div class="nav">
<i class="fa-solid fa-credit-card"></i>
Tarjetas
</div>

<div class="nav center">
<div class="fab">
M
</div>
</div>

<div class="nav">
<i class="fa-solid fa-arrow-right-arrow-left"></i>
Transferencias
</div>

<div class="nav">
<i class="fa-solid fa-bars"></i>
Más
</div>

</div>

</div>

</body>
</html>
